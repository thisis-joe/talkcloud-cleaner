appId: com.thisisjoe.talkcloudcleaner
productName: TalkCloudCleaner
directories:
  output: dist
files:
  - electron.mjs
  - app.mjs
  - match.mjs
  - talkcloud.mjs
  - usb.mjs
  - build/icon.png
  - public/**
  - package.json
extraResources:
  - from: .bundle-browser
    to: cloud-browser
    filter:
      - "**/*"
      - "!.links/**"
win:
  target: nsis
  icon: build/icon.ico
  artifactName: TalkCloudCleaner-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.utilities
  artifactName: TalkCloudCleaner-${version}-mac-${arch}.${ext}
  identity: "-"
  notarize: false
  extendInfo:
    NSLocalNetworkUsageDescription: 휴대폰의 파일 지문을 같은 Wi-Fi에서 받기 위해 로컬 네트워크를 사용합니다.
dmg:
  icon: build/icon.icns
