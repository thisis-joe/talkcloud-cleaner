<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>톡클라우드 중복 정리</title>
<link rel="stylesheet" href="/style.css">
<main>
  <header>
    <h1>톡클라우드 중복 정리</h1>
    <p>이 기기에 있는 파일을 찾아 톡클라우드 사본만 휴지통으로 옮깁니다.</p>
  </header>
  <section aria-labelledby="pair-title">
    <h2 id="pair-title">휴대폰 연결</h2>
    <p>PC와 같은 신뢰할 수 있는 Wi-Fi에서 QR을 스캔하세요.</p>
    <div class="line">
      <label>PC 네트워크 <select id="network"></select></label>
      <button id="pair">연결 코드 만들기</button>
    </div>
    <div id="pairing" hidden>
      <img id="qr" width="224" height="224" alt="휴대폰 연결용 QR 코드">
      <p><a id="pair-url">연결 주소</a> · <button id="end-pair" class="quiet">연결 닫기</button></p>
    </div>
  </section>
  <section aria-labelledby="scan-title">
    <h2 id="scan-title">비교할 목록</h2>
    <p>톡클라우드 창에서 드라이브 폴더, 채팅 파일 또는 사진/동영상 목록을 여세요. 비교 중에는 그 창을 그대로 두세요.</p>
    <div class="line">
      <button id="open" class="quiet">톡클라우드 열기</button>
      <label>저장 기기 <select id="device"></select></label>
      <label>최대 비교 개수 <input id="limit" type="number" min="1" max="1000" value="100"></label>
      <button id="scan">비교 시작</button>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="review" hidden>
    <h2>비교 결과</h2>
    <p id="summary"></p>
    <ul id="matches"></ul>
    <details id="skipped" hidden><summary>읽지 못한 항목</summary><ul id="skipped-list"></ul></details>
    <button id="trash" class="danger" hidden>클라우드 사본을 휴지통으로</button>
  </section>
  <section id="outcome" hidden>
    <h2>이동 결과</h2>
    <p id="outcome-summary"></p>
    <ul id="uncertain"></ul>
  </section>
</main>
<script type="module" src="/desktop.mjs"></script>
</html>
